server {
    listen 80 default_server;
    server_name 192.168.5.59 localhost;

    client_max_body_size 20m;

    location = / {
        return 302 /somity/;
    }

    location = /somity {
        return 301 /somity/;
    }

    location ^~ /somity/api/ {
        proxy_pass http://127.0.0.1:3004/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /somity;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # The browser sends the refresh cookie to the public auth path over LAN HTTP.
        proxy_cookie_path /api/auth /somity/api/auth;
        proxy_cookie_flags somity_refresh nosecure;
    }

    location = /somity/health {
        rewrite ^ /somity/api/health last;
    }

    location ^~ /somity/assets/ {
        alias D:/app/somity/frontend/dist-lan/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /somity/ {
        alias D:/app/somity/frontend/dist-lan/;
        index index.html;
        try_files $uri $uri/ /somity/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        return 404;
    }
}
